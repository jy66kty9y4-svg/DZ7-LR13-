services:
  nginx:
    image: nginx:latest
    container_name: dz7-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - security-app
    networks:
      - dz7-network

  security-app:
    image: cabinporn/dz7-lr13-security-app:latest
    build: .
    env_file:
      - .env
    container_name: dz7-security-app
    environment:
      ACCESS_KEY: LR11_SECRET_KEY
      REPLIT_DOMAINS: localhost
      POSTGRES_DB: security_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dz7-network

  postgres:
    image: postgres:16
    container_name: dz7-postgres
    environment:
      POSTGRES_DB: security_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dz7-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dz7-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@containerlab.ru
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - dz7-network

  prometheus:
    image: prom/prometheus:latest
    container_name: dz7-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - security-app
    networks:
      - dz7-network

  grafana:
    image: grafana/grafana:latest
    container_name: dz7-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - dz7-network

networks:
  dz7-network:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
