---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lr11-nginx-config
data:
  nginx.conf: |
    events {}

    http {
        server {
            listen 80;

            location / {
                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: lr11-security-pod
  labels:
    app: lr11-security
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf

    - name: security-app
      image: lr11-security-app:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8000
      env:
        - name: ACCESS_KEY
          value: "LR11_SECRET_KEY"
        - name: REPLIT_DOMAINS
          value: "localhost"
        - name: POSTGRES_DB
          value: "security_db"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_HOST
          value: "127.0.0.1"
        - name: POSTGRES_PORT
          value: "5432"
        - name: MPLCONFIGDIR
          value: "/tmp/matplotlib"

    - name: postgres
      image: postgres:16
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_DB
          value: "security_db"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"

    - name: pgadmin
      image: dpage/pgadmin4:latest
      ports:
        - containerPort: 5050
      env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: "admin@containerlab.ru"
        - name: PGADMIN_DEFAULT_PASSWORD
          value: "admin"
        - name: PGADMIN_LISTEN_PORT
          value: "5050"

  volumes:
    - name: nginx-config
      configMap:
        name: lr11-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: lr11-nginx-service
spec:
  type: NodePort
  selector:
    app: lr11-security
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
