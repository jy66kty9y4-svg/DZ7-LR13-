<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование клиента</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1f2933;
        }

        .page {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
        }

        .header,
        .section {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #52616b;
            line-height: 1.5;
        }

        .form-row {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button,
        a.button-link {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            background-color: #1f2933;
            color: #ffffff;
        }

        a.button-link {
            background-color: #e9eef3;
            color: #1f2933;
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="header">
            <h1>Редактирование клиентской записи</h1>

            <p>
                После сохранения данные будут записаны в файл clients.json.
                При возвращении на страницу результатов контейнер повторно обработает обновленные данные.
            </p>
        </header>

        <section class="section">
            <form method="post">
                {% csrf_token %}

                <div class="form-row">
                    <label for="client_id">ID клиента</label>
                    <input type="text" id="client_id" name="client_id" value="{{ client.client_id }}">
                </div>

                <div class="form-row">
                    <label for="ip">IP-адрес</label>
                    <input type="text" id="ip" name="ip" value="{{ client.ip }}">
                </div>

                <div class="form-row">
                    <label for="channel">Канал</label>
                    <input type="text" id="channel" name="channel" value="{{ client.channel }}">
                </div>

                <div class="form-row">
                    <label for="token">Токен</label>
                    <input type="text" id="token" name="token" value="{{ client.token }}">
                </div>

                <div class="form-row">
                    <label for="requests">Количество запросов</label>
                    <input type="number" id="requests" name="requests" value="{{ client.requests }}">
                </div>

                <div class="form-row">
                    <label for="payload">Объем данных</label>
                    <input type="number" id="payload" name="payload" value="{{ client.payload }}">
                </div>

                <div class="form-row">
                    <label for="timestamp">Временная метка</label>
                    <input type="number" id="timestamp" name="timestamp" value="{{ client.timestamp }}">
                </div>

                <div class="buttons">
                    <button type="submit">Сохранить изменения</button>

                    <a class="button-link" href="{% url 'security_channel_clients' %}">
                        Назад к данным клиентов
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
